name: qingtu-photo
services:
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: qingtu-photo-server
    env_file: .env
    environment:
      PORT: 3001
      DATA_DIR: /app/server/data
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - photo_temp:/app/server/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  mysql:
    image: mysql:8.0
    container_name: qingtu-photo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME}
      MYSQL_USER: ${DB_USER:?set DB_USER}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS}
    volumes:
      - photo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  photo_temp:
  photo_mysql:
